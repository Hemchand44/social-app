name: CI

on:
  push:
    branches:
      - main                                

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
      - uses: actions/checkout@v4
        

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend dependencies
        working-directory: ./Backend
        run: npm install

      - name: Install Frontend dependencies
        working-directory: ./Frontend
        run: npm install

      - name: build Frontend
        working-directory: ./Frontend
        run: npm run build

        